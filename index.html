<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>Used to Bees Reunion Jukebox</title>
  <link rel="stylesheet" href="styles.css?v=42">
</head>
<body>
<main class="app">
  <header class="masthead">
    <div class="kicker">BBCS CLASS OF ’77</div>
    <h1>Used to Bees Reunion Jukebox</h1>
    <p>Long-Distance Dedications</p>
  </header>
  <section class="jukebox">
    <div class="chrome"></div>
    <div class="selector-deck">
      <button id="previousProfile" class="selector-key">◀</button>
      <label><span class="sr-only">Choose a classmate</span><select id="profileSelect"></select></label>
      <button id="nextProfile" class="selector-key">▶</button>
      <button id="randomProfile" class="surprise-key">Surprise Me</button>
    </div>
    <div class="glass-window">
      <div class="title-strip">
        <span id="previousName"></span><strong id="activeNameLeft"></strong><span id="nextName"></span>
      </div>
      <section class="portrait-stage">
        <div class="photo-frame">
          <img id="yearbookPhoto" class="portrait portrait-visible" alt="">
          <img id="currentPhoto" class="portrait" alt="">
          <div id="photoFallback" class="photo-fallback" hidden>Photo unavailable</div>
        </div>
        <div class="photo-tabs">
          <button id="showYearbook" class="photo-tab active">1977</button>
          <button id="showCurrent" class="photo-tab">Today</button>
        </div>
      </section>
      <div class="title-strip strip-right">
        <span id="artistStrip"></span><strong id="songStrip"></strong><span id="yearStrip"></span>
      </div>
    </div>
    <section class="now-playing">
      <div>
        <div class="now-label">NOW PLAYING</div>
        <div id="classmateName" class="classmate-name"></div>
        <h2 id="songTitle"></h2>
        <div class="artist-line"><span id="artistName"></span> • <span id="songYear"></span></div>
      </div>
      <div>
        <div id="statusText" class="status">READY</div>
        <div class="progress-row">
          <span id="elapsedTime">0:00</span>
          <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
          <span id="durationTime">0:00</span>
        </div>
      </div>
    </section>
    <div class="control-deck">
      <button id="playButton" class="control primary">▶ Play</button>
      <button id="pauseButton" class="control">Ⅱ Pause</button>
      <button id="restartButton" class="control">↺ Restart</button>
      <button id="stopButton" class="control">■ Stop</button>
    </div>
    <div class="chrome"></div>
  </section>

  <!-- One audio element is used for the whole sequence. This is more reliable on phones/tablets. -->
  <audio id="sequenceAudio" preload="metadata"></audio>
</main>
<script src="player.js?v=42"></script>
</body>
</html>
