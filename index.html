<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Used to Bees 8-Track Jukebox</title>
<link rel="stylesheet" href="styles.css?v=22"></head>
<body><main class="jukebox-wrap">
<header class="jukebox-header">
<div class="eyebrow">BBCS CLASS OF ’77</div>
<h1>Used to Bees 8-Track Jukebox</h1>
<p>Long-Distance Dedications from the Class of ’77</p>
<div class="selector-bar">
<button id="previousProfile" class="nav-button">◀ Previous</button>
<label class="profile-select-label"><span>Choose a classmate</span><select id="profileSelect"></select></label>
<button id="nextProfile" class="nav-button">Next ▶</button>
<button id="randomProfile" class="random-button">🎲 Surprise Me</button>
</div></header>

<section class="player">
<img class="player-art" src="assets/player-bg.png?v=22" alt="Vintage yellow 8-track stereo player">
<div id="cartridgeOverlay" class="cartridge-overlay theme-cream">
<div class="cartridge-brand">USED TO BEES</div>
<div id="cartridgeName" class="cartridge-name">JOHN BERRY</div>
<div id="cartridgeSong" class="cartridge-song">SLOW RIDE</div>
<div class="cartridge-meta"><span id="cartridgeArtist">FOGHAT</span><span id="cartridgeYear">1975</span></div>
</div>
<div class="now-playing-overlay">
<div class="display-label">NOW PLAYING</div>
<div id="displaySong" class="display-song">Slow Ride</div>
<div id="displayArtist" class="display-artist">Foghat</div>
<div id="displayYear" class="display-year">1975</div>
<div class="display-progress-row"><span id="elapsedTime">0:00</span>
<div class="display-progress-track"><div id="displayProgressFill" class="display-progress-fill"></div></div>
<span id="durationTime">0:00</span></div>
</div>
<div id="programNumber" class="program-number">3</div>
<div class="program-glow"></div><div class="play-glow"></div><div id="vuNeedle" class="vu-needle"></div>
<button id="playButton" class="hotspot play-hotspot" aria-label="Play or pause"></button>
<button id="restartButton" class="hotspot rewind-hotspot" aria-label="Restart"></button>
<button id="stopButton" class="hotspot stop-hotspot" aria-label="Stop"></button>
<div id="statusText" class="status-text">READY</div>
<audio id="jingleAudio" preload="metadata" src="audio/jingles/Used-to-Bees-Reunion-Countdown.mp3"></audio><audio id="dedicationAudio" preload="metadata"></audio><audio id="songAudio" preload="metadata"></audio>
</section>
<footer class="jukebox-footer"><span id="profileSummary"></span></footer>
</main><script src="player.js?v=22"></script></body></html>
