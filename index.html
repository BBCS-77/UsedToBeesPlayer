<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Used to Bees 8-Track Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <section class="player" aria-label="Used to Bees 8-track audio player">
      <img class="player-art" src="assets/player-bg.png" alt="Vintage yellow 8-track stereo player">

      <div class="dynamic-display">
        <div class="small-label">NOW PLAYING</div>
        <div id="songTitle" class="song-title">Slow Ride</div>
        <div id="artistLine" class="artist-line">Foghat</div>
        <div id="yearLine" class="year-line">1975</div>
        <div class="elapsed-label">ELAPSED TIME</div>
        <div class="time-row">
          <span id="timeText">0:00</span>
          <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
          <span id="durationText">0:00</span>
        </div>
      </div>

      <div class="dynamic-cartridge">
        <div class="cartridge-brand">USED TO BEES</div>
        <div id="classmateName" class="cartridge-name">JOHN BERRY</div>
        <div id="cartridgeSong" class="cartridge-song">SLOW RIDE</div>
        <div class="cartridge-bottom">
          <span id="cartridgeArtist">FOGHAT</span>
          <span id="cartridgeYear">1975</span>
        </div>
      </div>

      <div class="program-light" aria-hidden="true"></div>
      <div class="play-light" aria-hidden="true"></div>
      <div class="vu-needle" aria-hidden="true"></div>

      <button id="playSequence" class="hotspot play-hotspot" type="button" aria-label="Play dedication and song"></button>
      <button id="pauseAudio" class="hotspot pause-hotspot" type="button" aria-label="Pause audio"></button>
      <button id="restartAudio" class="hotspot rewind-hotspot" type="button" aria-label="Restart from dedication"></button>
      <button id="stopAudio" class="hotspot stop-hotspot" type="button" aria-label="Stop audio"></button>

      <div id="statusText" class="status-text">Ready</div>

      <audio id="dedicationAudio" preload="metadata"></audio>
      <audio id="songAudio" preload="metadata"></audio>
    </section>
  </main>

  <script src="player.js"></script>
</body>
</html>
