<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Used to Bees 8-Track Player</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <main class="stage">
    <section class="player" aria-label="Used to Bees 8-track audio player">
      <img class="player-art" src="assets/player-bg.png?v=3" alt="Vintage yellow 8-track stereo player">

      <button id="playButton" class="hotspot play-hotspot" type="button" aria-label="Play or pause"></button>
      <button id="restartButton" class="hotspot rewind-hotspot" type="button" aria-label="Restart dedication and song"></button>
      <button id="stopButton" class="hotspot stop-hotspot" type="button" aria-label="Stop"></button>

      <div id="programGlow" class="program-glow" aria-hidden="true"></div>
      <div id="playGlow" class="play-glow" aria-hidden="true"></div>
      <div id="statusText" class="status">READY</div>

      <audio id="dedicationAudio" preload="metadata"></audio>
      <audio id="songAudio" preload="metadata"></audio>
    </section>
  </main>
  <script src="player.js?v=3"></script>
</body>
</html>
